stages:
  - deploy

build-and-deploy:
  stage: deploy
  image: node:20
  timeout: 3h
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == "main"
    - when: manual
  script:
    - npm ci
    - STATIC_EXPORT=1 npm run build
    - apt-get update -qq && apt-get install -y -qq lftp
    - lftp -c "
        set ssl:verify-certificate no;
        set ftp:ssl-allow no;
        set net:timeout 60;
        set net:max-retries 3;
        set mirror:parallel-transfer-count 10;
        set ftp:use-feat no;
        open -u $FTP_USERNAME,$FTP_PASSWORD -p 2121 $FTP_SERVER;
        mirror --reverse --parallel=10
          --exclude-glob .htaccess
          --exclude-glob wp-config.php
          --exclude wp-admin/
          --exclude wp-includes/
          --exclude wp-content/
          out/ public_html/;
        bye"
  environment:
    name: production
